<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenForge | Live Display</title>
    <meta name="description" content="A live, Telegram-powered party screen by OpenForge. Messages, themes, effects and the occasional prank, in real time.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://display.openforge.online/">
    <meta property="og:title" content="OpenForge | Live Display">
    <meta property="og:description" content="A live, Telegram-powered party screen. Watch the messages roll in.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎪</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Fredoka:wght@400;600;700&family=Orbitron:wght@700;900&family=Pacifico&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="{{ state.theme }}">

    <canvas id="bg" class="layer-bg"></canvas>
    <div class="scene" id="scene" aria-hidden="true"></div>

    <div class="app" id="app">

        <header class="bar">
            <span class="live"><i class="dot"></i>LIVE</span>
            <span class="theme-tag" id="themeTag">{{ state.theme }}</span>
        </header>

        <main class="stage" id="stage">
            <div class="trail" id="trail"></div>
            <div class="spot" id="spot">
                <div class="spot-text" id="spotText"></div>
                <div class="spot-meta" id="spotMeta"></div>
            </div>
            <div class="welcome" id="welcome">
                <div class="welcome-emoji" id="welcomeEmoji"></div>
                <div class="welcome-text" id="welcomeText"></div>
            </div>
        </main>

        <footer class="bar">
            <span class="status" id="status">Connecting…</span>
            <button class="sound" id="sound" type="button">🔇 Tap for sound</button>
            <span class="count" id="count">0 messages</span>
        </footer>

    </div>

    <canvas id="fx" class="layer-fx"></canvas>
    <div class="disco-lights" id="disco" aria-hidden="true"><span class="disco-ball">🪩</span></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="countdown" id="countdown"></div>
    <div class="prank" id="prank"></div>
    <div class="gotcha" id="gotcha">😜 GOTCHA!</div>

    <script>
        window.INITIAL = {
            state: {{ state | tojson }},
            messages: {{ messages | tojson }}
        };
    </script>
    <script src="/static/app.js"></script>

</body>
</html>
